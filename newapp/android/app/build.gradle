plugins {
    id "com.android.application"
    id "dev.flutter.flutter-gradle-plugin"
    id "org.jetbrains.kotlin.android"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "sn.yaatalmbinde.app"
    compileSdk = 36
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "sn.yaatalmbinde.app"  // ⚠️ doit matcher namespace
        minSdk = 23
        targetSdk = 35
        versionCode = 2
        versionName = "1.2.0"

            // Lecture sécurisée de la clé Maps
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file('local.properties')
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                localProperties.load(reader)
            }
        }
        
        manifestPlaceholders = [
            // mapsApiKey: localProperties.getProperty('MAPS_API_KEY', ''),
            applicationName : "io.flutter.app.FlutterApplication"

        ]
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

flutter {
    source = "../.."
}

// Force une version de core-ktx compatible avec AGP 8.7.0 + compileSdk 35
configurations.all {
    resolutionStrategy {
        force 'androidx.core:core-ktx:1.15.0'
        force 'androidx.core:core:1.15.0'
    }
}